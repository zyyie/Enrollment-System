<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Geranova EMS</title>
  <link rel="stylesheet" href="admin/css/admin.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5f9; }
    .admin-login-card { width: min(420px, 92vw); background: #fff; border-radius: 12px; padding: 32px; box-shadow: 0 10px 30px rgba(15,23,42,.08); }
    .admin-login-card img { width: 72px; display: block; margin: 0 auto 16px; }
    .admin-login-card h1 { text-align: center; font-size: 22px; margin: 0 0 8px; }
    .admin-login-card p { text-align: center; color: #64748b; margin: 0 0 24px; font-size: 14px; }
    .admin-login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    .admin-login-card input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 14px; box-sizing: border-box; }
    .admin-login-card button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-weight: 600; cursor: pointer; }
    .admin-login-card .error { color: #dc2626; font-size: 13px; min-height: 18px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="admin-login-card">
    <img src="assets/geranova-logo.png" alt="Geranova Logo">
    <h1>Admin Portal</h1>
    <p>Faculty / Registrar sign in only</p>
    <div class="error" id="loginError"></div>
    <form id="adminLoginForm">
      <label for="facultyId">Admin / Faculty ID</label>
      <input type="text" id="facultyId" placeholder="FAC-2026-0001" required>
      <label for="password">Password</label>
      <input type="password" id="password" required>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/supabase-service.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const facultyId = document.getElementById('facultyId').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/auth/faculty', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ facultyId, password })
        });
        const data = await res.json();
        if (!res.ok || !data.success) {
          errorEl.textContent = data.error || 'Invalid credentials';
          return;
        }
        sessionStorage.setItem('shsFaculty', JSON.stringify(data.faculty || data.user || data));
        sessionStorage.setItem('loginRole', 'faculty');
        window.location.href = 'admin/dashboard.html';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed';
      }
    });
  </script>
</body>
</html>
