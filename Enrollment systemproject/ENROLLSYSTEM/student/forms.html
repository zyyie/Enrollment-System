<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms - Enrollment System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="student-layout">
  <div id="studentSidebarWrap"></div>
  <div class="student-main">
    <div id="studentHeader"></div>
    <main class="main-content">
    <h1 class="page-title">Forms</h1>

    <div class="card">
      <div class="card-header" id="formsHeader"></div>
      <ul class="forms-list" id="formsList"></ul>
    </div>
    </main>
    <div id="footer"></div>
  </div>

  <div id="accessibility"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/supabase-service.js"></script>
  <script src="../js/data.js?v=6"></script>
  <script src="../js/icons.js?v=8"></script>
  <script src="../js/app.js?v=8"></script>
  <script>
    const student = initPage('forms');
    document.getElementById('formsHeader').textContent = formatStudentName(student);

    document.getElementById('formsList').innerHTML = FORMS_LIST.map(form => `
      <li onclick="alert('Downloading: ${form}')">
        <span class="pdf-icon">📄</span>
        ${form}
      </li>
    `).join('');
  </script>
</body>
</html>
