<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule - Enrollment System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="student-layout">
  <div id="studentSidebarWrap"></div>
  <div class="student-main">
    <div id="studentHeader"></div>
    <main class="main-content">
    <h1 class="page-title" id="scheduleTitle"></h1>

    <div class="card">
      <div class="card-header" id="scheduleHeader"></div>
      <div class="card-body" style="padding:0;">
        <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Subject Code</th>
              <th>Description</th>
              <th>Lec</th>
              <th>Lab</th>
              <th>Unit</th>
              <th>Schedule</th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
        </div>
      </div>
    </div>
    </main>
    <div id="footer"></div>
  </div>

  <div id="accessibility"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/supabase-service.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/icons.js?v=8"></script>
  <script src="../js/app.js?v=9"></script>
  <script>
    const student = initPage('schedule');
    document.getElementById('scheduleTitle').textContent = `School Year ${student.schoolYear} - ${student.semester}`;
    document.getElementById('scheduleHeader').textContent = formatStudentName(student);

    function renderScheduleRows(rows) {
      if (!rows.length) {
        return `<tr><td colspan="7" style="text-align:center;padding:24px;color:#64748b;">
          No class schedule published yet for ${student.strand || 'your strand'}. Check back after the registrar saves the schedule.
        </td></tr>`;
      }
      return rows.map((s, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${s.code || ''}</td>
          <td>${s.description || ''}</td>
          <td>${s.lec ?? ''}</td>
          <td>${s.lab ?? ''}</td>
          <td>${s.unit ?? ''}</td>
          <td>${s.schedule || 'TBA'}</td>
        </tr>
      `).join('');
    }

    async function loadSchedule() {
      const tbody = document.getElementById('scheduleBody');
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;">Loading schedule...</td></tr>';

      if (SupabaseService.isEnabled()) {
        const rows = await SupabaseService.getStudentStrandSchedule(student.id);
        if (rows && rows.length) {
          tbody.innerHTML = renderScheduleRows(rows);
          return;
        }
      }

      tbody.innerHTML = renderScheduleRows(SCHEDULE_DATA);
    }

    loadSchedule();
  </script>
</body>
</html>
