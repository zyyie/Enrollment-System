<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms - Enrollment System</title>
  <link rel="stylesheet" href="../css/styles.css?v=22">
</head>
<body class="student-layout">
  <div id="studentSidebarWrap"></div>
  <div class="student-main">
    <div id="studentHeader"></div>
    <main class="main-content">

    <div class="card">
      <div class="card-header" id="formsHeader"></div>
      <ul class="forms-list" id="formsList"></ul>
    </div>
    </main>
    <div id="footer"></div>
  </div>

  <div id="accessibility"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/supabase-service.js?v=6"></script>
  <script src="../js/data.js?v=9"></script>
  <script src="../js/icons.js?v=2"></script>
  <script src="../js/app.js?v=15"></script>
  <script>
    const student = initPage('forms');
    document.getElementById('formsHeader').textContent = formatStudentName(student);

    const safeId = String(student.id || 'student').replace(/[^a-zA-Z0-9-_]/g, '_');
    const regFormUrl = `/api/student/registration-certificate?id=${encodeURIComponent(student.id)}`;

    document.getElementById('formsList').innerHTML = FORMS_LIST.map(form => {
      const isRegForm = form === 'Official Registration Form';
      const href = isRegForm ? regFormUrl : '#';
      const action = isRegForm
        ? `window.open('${href}', '_blank', 'noopener,noreferrer')`
        : `alert('Downloading: ${form.replace(/'/g, "\\'")}')`;
      return `
      <li onclick="${action}">
        <span class="pdf-icon">${isRegForm ? '📋' : '📄'}</span>
        ${form}${isRegForm ? ' <small style="color:#64748b">(PDF receipt)</small>' : ''}
      </li>`;
    }).join('');
  </script>
</body>
</html>
